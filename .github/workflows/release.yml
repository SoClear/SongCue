name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are not fully configured"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify Release version
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("app/build/outputs/apk/release/output-metadata.json") as f:
              metadata = json.load(f)
          assert metadata["applicationId"] == "io.github.soclear.songcue", "Unexpected application ID"
          assert len(metadata["elements"]) == 1, "Expected a single APK"
          apk = metadata["elements"][0]
          expected_tag = f"{apk['versionCode']}-{apk['versionName']}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(f"Release tag must be {expected_tag}, got {os.environ['RELEASE_TAG']}")
          print(f"Verified release version: {expected_tag}")
          PY

      - name: Verify Release signature
        env:
          EXPECTED_CERT_SHA256: a6e0e6e34ce21bbff8a2a3f668ad3512125864e06bb487f20c9a6ccd33814305
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found"
            exit 1
          fi
          SIGNATURE_INFO=$("$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          ACTUAL_CERT_SHA256=$(printf '%s\n' "$SIGNATURE_INFO" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected signing certificate: $ACTUAL_CERT_SHA256"
            exit 1
          fi
          echo "Verified signing certificate: $ACTUAL_CERT_SHA256"

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/SongCue_${RELEASE_TAG}.apk"

      - name: Upload Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: app/build/outputs/apk/release/SongCue_*.apk
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Clean up signing files
        if: always()
        run: rm -f app/release.keystore keystore.properties
